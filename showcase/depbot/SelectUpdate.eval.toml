# Pins depbot's one judgment call: which single update to pick tonight.
# Run: aspec eval SelectUpdate.eval.toml --adapter-cmd 'claude -p'

spec = "depbot.aspec.py"
task = "SelectUpdate"

[[case]]
name = "patch beats major (safest-first)"
[case.inputs]
candidates = [
  { name = "left-pad", current = "1.3.0", target = "2.0.0", kind = "major" },
  { name = "lodash", current = "4.17.20", target = "4.17.21", kind = "patch" },
]
[case.expect]
selected = true
name = "lodash"
kind = "patch"

[[case]]
name = "a major alone may be proposed, flagged as such"
[case.inputs]
candidates = [
  { name = "react", current = "17.0.2", target = "18.3.1", kind = "major" },
]
[case.expect]
selected = true
kind = "major"

[[case]]
name = "empty queue is a clean finish, not a failure"
[case.inputs]
candidates = []
[case.expect]
selected = false
