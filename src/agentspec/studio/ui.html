<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aspec studio</title>
<style>
:root{
  --bg:#0e1320; --panel:#151c2c; --panel2:#1a2234; --line:#26304a;
  --node:#1d2740; --node-edge:#33415f; --text:#d9e1f2; --dim:#8b96af;
  --accent:#7fb0ff; --gate:#e6b455; --err:#e5636c; --warn:#e0a34d;
  --ok:#5cc492; --violet:#b08df0; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-weight:700;letter-spacing:.4px}
header .logo span{color:var(--accent)}
.chip{font:12px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--dim)}
.chip b{color:var(--text);font-weight:600}
.spacer{flex:1}
.toggles{display:flex;gap:6px}
.tgl{font:12px var(--sans);border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:6px;padding:4px 10px;cursor:pointer;user-select:none}
.tgl.on{color:var(--text);border-color:var(--accent);background:#1d2a45}
.tgl.sim.on{border-color:var(--gate);background:#2b2410;color:var(--gate)}
#errbar{display:none;background:#3a1d24;color:#f2b7bc;font:12px var(--mono);padding:8px 14px;border-bottom:1px solid #59303a;white-space:pre-wrap}
#simbar{display:none;background:#221d10;border-bottom:1px solid #4a3d1d;padding:8px 14px;font-size:12px}
#simbar .banner{color:var(--gate);font-weight:600;margin-right:14px}
#simbar label{display:inline-flex;align-items:center;gap:5px;margin:2px 12px 2px 0;font:12px var(--mono);color:var(--dim);cursor:pointer}
#simbar label.off{color:var(--err)}
#simbar button{font:11px var(--sans);background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:2px 8px;cursor:pointer}
main{flex:1;display:flex;min-height:0}
#srcpanel{width:430px;min-width:260px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;display:none;font:12px var(--mono);line-height:1.55;padding:8px 0}
#srcpanel.on{display:block}
#srcpanel .srcline{display:flex;white-space:pre}
#srcpanel .srcline .ln{color:#3d4a68;text-align:right;min-width:44px;padding-right:10px;user-select:none;flex:none}
#srcpanel .srcline .cd{color:var(--text);padding-right:14px}
#srcpanel .srcline.hl{background:#1d2a45;box-shadow:inset 3px 0 0 var(--accent)}
#srcpanel .srcline.hl2{background:#171f33;box-shadow:inset 3px 0 0 var(--violet)}
#canvasWrap{flex:1;overflow:auto;position:relative;text-align:center}
#canvas{display:inline-block}
#empty{color:var(--dim);padding:40px;font-size:14px}
#side{width:400px;min-width:300px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs .tab{flex:1;text-align:center;padding:9px;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
#tabs .tab.on{color:var(--text);border-bottom-color:var(--accent)}
#tabs .tab .cnt{font:11px var(--mono);background:var(--panel2);border-radius:8px;padding:1px 6px;margin-left:4px}
#inspector,#issues{flex:1;overflow:auto;padding:14px;display:none}
#inspector.on,#issues.on{display:block}
#inspector h2{font-size:15px;margin-bottom:2px}
#inspector h2 .task{color:var(--accent)}
#inspector h2 .task.link{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#inspector h2 .task.link:hover{color:#a8ccff}
#inspector h2 .task.link:after{content:" ↗";font-size:11px;color:var(--dim)}
#inspector .doc{font-size:13px;color:var(--text);opacity:.9;margin:8px 0 12px;line-height:1.5}
#inspector h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:16px 0 6px}
.kv{font:12px var(--mono);line-height:1.7}
.kv .k{color:var(--accent)}
.kv .t{color:var(--dim)}
.rule{border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;font-size:12.5px;line-height:1.45}
.rule.must{border-left-color:var(--err)}
.rule.should{border-left-color:var(--warn)}
.rule.may{border-left-color:var(--dim)}
.rule .sev{font:10px var(--mono);text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:6px}
.rule.must .sev{background:#3a2026;color:#f0a7ad}
.rule.should .sev{background:#3a2f18;color:#ecc078}
.rule.may .sev{background:var(--panel2);color:var(--dim)}
.rule .why{display:block;color:var(--dim);font-style:italic;margin-top:3px;font-size:12px}
.rule .src{font:10px var(--mono);color:var(--violet);margin-left:6px}
.tool{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin:6px 0;font-size:12.5px}
.tool b{font-family:var(--mono)}
.tool .surface{color:var(--dim);font:11.5px var(--mono);display:block;margin-top:3px;word-break:break-all}
.flag{font:10px var(--mono);border-radius:4px;padding:1px 5px;margin-left:6px}
.flag.strict{background:#3a2026;color:#f0a7ad}
.flag.excl{background:#2a1f3a;color:#c9aef5}
.field{font:12px var(--mono);line-height:1.7}
.field .b{color:var(--warn)}
.decl{font-size:12.5px;margin:4px 0;color:var(--text)}
.decl .lbl{color:var(--dim);font:11px var(--mono);margin-right:6px}
.issue{border-left:3px solid var(--warn);background:var(--panel2);padding:7px 10px;margin:7px 0;font-size:12.5px;cursor:pointer;border-radius:0 6px 6px 0}
.issue.error{border-left-color:var(--err)}
.issue .code{font:11px var(--mono);color:var(--accent);margin-right:6px}
.issue .loc{color:var(--dim);font:11px var(--mono)}
.muted{color:var(--dim);font-size:12.5px}
.redtable{width:100%;border-collapse:collapse;font:11px var(--mono);margin-top:4px}
.redtable th{color:var(--dim);text-align:left;font-weight:500;padding:3px 6px;border-bottom:1px solid var(--line)}
.redtable td{padding:4px 6px;border-bottom:1px solid #1d2537;vertical-align:top}
.redtable td:first-child{color:var(--gate)}
.redtable tr.other td:first-child{color:var(--ok)}
#tip{position:fixed;display:none;background:#0b0f1a;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:11.5px var(--mono);color:var(--text);pointer-events:none;z-index:20;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.5);line-height:1.6}
#tip .h{color:var(--dim)}
svg text{font-family:var(--sans);user-select:none}
.wave-band{fill:#141b2b}
.wave-lbl{fill:#3d4a68;font:11px var(--mono)}
.node rect.box{fill:var(--node);stroke:var(--node-edge);stroke-width:1.2;rx:9}
.node:hover rect.box{stroke:var(--accent)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node.skipped{opacity:.32}
.node.skipped rect.box{stroke-dasharray:5 4}
.node.t-ok rect.box{stroke:var(--ok);stroke-width:1.8}
.node.t-skipped{opacity:.35}
.node.t-skipped rect.box{stroke-dasharray:5 4}
.node.t-declared_fallback rect.box{stroke:var(--warn);stroke-width:1.8}
.node.t-failed rect.box,.node.t-unwound rect.box{stroke:var(--err);stroke-width:2}
.node.flash rect.box{animation:flashpulse 0.65s ease-in-out 4}
@keyframes flashpulse{50%{stroke:var(--accent);stroke-width:4;fill:#243255}}
#pinnote{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);font:12px var(--sans);padding:6px;margin-top:6px;min-height:52px}
.pinbtn{font:12px var(--sans);border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:6px;padding:4px 10px;cursor:pointer}
.pinbtn.on{color:var(--gate);border-color:var(--gate)}
.tchip{font:11px var(--mono);border-radius:5px;padding:2px 8px;margin-left:4px}
.tchip.conforming{background:#12301f;color:#7bd8a6}
.tchip.declared_fallback{background:#33270f;color:#eec27d}
.tchip.aborted{background:#3a1d24;color:#f2a7ae}
.node .var{fill:var(--text);font-size:13px;font-weight:600}
.node .task{fill:var(--dim);font-size:11px}
.node text.task[data-def]{cursor:pointer}
.node text.task[data-def]:hover{fill:var(--accent);text-decoration:underline}
.node .chips{fill:var(--dim);font:9.5px var(--mono)}
.node.inputs rect.box{fill:#182338;stroke-dasharray:4 3}
.badge{font:9.5px var(--mono)}
.edge{fill:none;stroke:#3d4a68;stroke-width:1.4;marker-end:url(#arr)}
.edge.gate{stroke:var(--gate);stroke-dasharray:6 4;marker-end:url(#arrg)}
.edge.fanout{stroke:var(--violet);marker-end:url(#arrv)}
.edge.dead{stroke:var(--err);opacity:.7}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge-lbl{fill:var(--gate);font:10px var(--mono)}
</style>
</head>
<body>
<header>
  <div class="logo">aspec <span>studio</span></div>
  <div class="chip" id="filechip">…</div>
  <div class="chip" id="rootchip"></div>
  <div class="spacer"></div>
  <div class="toggles">
    <div class="tgl on" id="srctgl">Source</div>
    <div class="tgl on" data-layer="gates">Gates</div>
    <div class="tgl on" data-layer="failure">Failure</div>
    <div class="tgl" data-layer="tools">Tools</div>
    <div class="tgl" data-layer="waves">Waves</div>
    <div class="tgl" data-layer="trace" id="tracetgl" style="display:none">Trace</div>
    <div class="tgl sim" id="simtgl">Simulate</div>
  </div>
</header>
<div id="errbar"></div>
<div id="simbar">
  <span class="banner" id="simbanner"></span>
  <span id="simgates"></span>
  <button id="simreset">reset</button>
</div>
<main>
  <div id="srcpanel" class="on"><div class="muted" style="padding:12px">waiting for the spec source…</div></div>
  <div id="canvasWrap"><div id="empty">waiting for a parsed spec…</div><svg id="canvas"></svg></div>
  <div id="side">
    <div id="tabs">
      <div class="tab on" data-tab="inspector">Inspector</div>
      <div class="tab" data-tab="issues">Issues<span class="cnt" id="issuecnt">0</span></div>
    </div>
    <div id="inspector" class="on"><div class="muted">Click a step on the canvas.</div></div>
    <div id="issues"></div>
  </div>
</main>
<div id="tip"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const S={version:-1,data:null,src:null,sel:null,layers:{gates:true,failure:true,tools:false,waves:false,trace:false},
         sim:false,gateVals:{},skipped:new Set(),trace:null,pins:{},traceSeen:false};

const NW=190, NH=58, GX=46, GY=64, PAD=40;

function esc(s){return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

// ---------- polling ----------
async function poll(){
  if(window.EMBEDDED_SPEC){
    if(S.version<0){S.version=1;S.data=window.EMBEDDED_SPEC;S.src=window.EMBEDDED_SOURCE??null;onData();}
    return; // static export: no server, no polling
  }
  try{
    const r=await fetch("/api/spec"); const st=await r.json();
    if(st.version!==S.version){
      S.version=st.version;
      $("errbar").style.display=st.errors.length?"block":"none";
      $("errbar").textContent=st.errors.join("\n");
      S.pins=st.pins||{};
      if(st.trace&&!S.traceSeen){S.traceSeen=true;S.layers.trace=true;}
      S.trace=st.trace||null;
      $("tracetgl").style.display=S.trace?"":"none";
      $("tracetgl").classList.toggle("on",S.layers.trace);
      if(st.payload){S.data=st.payload;}
      if(st.source!=null){S.src=st.source;}
      if(S.data) onData();
      if(st.highlight){
        flashNode(st.highlight);
        syncSource(S.data?.pipeline?.steps.find(s=>s.var===st.highlight)?.line);
        fetch("/api/highlight_done",{method:"POST"});
      }
    }
  }catch(e){/* server restarting; keep last view */}
  setTimeout(poll,1500);
}

function flashNode(v){
  const node=document.querySelector(`[data-node="${CSS.escape(v)}"]`);
  if(!node) return;
  node.classList.add("flash");
  setTimeout(()=>node.classList.remove("flash"),2600);
}

function onData(){
  const d=S.data;
  $("filechip").innerHTML=`<b>${esc(d.file.split("/").pop())}</b>`;
  let root=d.root?`root: <b>${esc(d.root)}</b>`:"no root task";
  if(S.trace) root+=` <span class="tchip ${esc(S.trace.status)}">run: ${esc(S.trace.status)} · ${esc(S.trace.mode)}</span>`;
  $("rootchip").innerHTML=root;
  if(!S.sel&&d.root) S.sel=d.root;  // default: the orchestrator + its reduction table
  const gated=(d.pipeline?.steps||[]).filter(s=>s.gate);
  for(const s of gated) if(!(s.gate in S.gateVals)) S.gateVals[s.gate]=true;
  renderSource();
  computeSkips(); renderAll();
  syncSource(null,false);  // restore the highlight without stealing scroll
}

function renderAll(){renderCanvas();renderSimBar();renderIssues();renderInspector();}

// ---------- source panel ----------
function renderSource(){
  const panel=$("srcpanel");
  if(S.src==null){panel.innerHTML=`<div class="muted" style="padding:12px">source unavailable</div>`;return;}
  panel.innerHTML=S.src.split("\n").map((l,i)=>
    `<div class="srcline" data-l="${i+1}"><span class="ln">${i+1}</span><span class="cd">${esc(l)||" "}</span></div>`).join("");
}
function taskDefLine(name){
  // the class-definition line of a task, only when it lives in THIS file —
  // an imported task's line points into a sibling spec
  const t=S.data?.tasks[name];
  if(!t||!t.line||S.src==null) return null;
  const txt=S.src.split("\n")[t.line-1]||"";
  return txt.includes("class "+name)?t.line:null;
}
function jumpToDef(name){
  const line=taskDefLine(name);
  if(!line) return;
  if(!$("srcpanel").classList.contains("on")){
    $("srcpanel").classList.add("on");$("srctgl").classList.add("on");
  }
  syncSource(line);
}
function syncSource(line,scroll=true){
  // line: explicit target (issue clicks); otherwise derived from S.sel —
  // primary = the step's bind in the orchestrator, secondary = its task class
  const panel=$("srcpanel");
  if(!panel.classList.contains("on")||!S.data||S.src==null) return;
  panel.querySelectorAll(".srcline.hl,.srcline.hl2").forEach(x=>x.classList.remove("hl","hl2"));
  let primary=line??null, secondary=null;
  if(primary==null){
    const d=S.data;
    const st=d.pipeline?.steps.find(s=>s.var===S.sel);
    if(S.sel==="_inputs"&&d.root) primary=d.tasks[d.root]?.line;
    else if(st){
      primary=st.line;
      const t=d.tasks[st.task];
      if(t&&t.line&&t.line!==primary) secondary=t.line;
      // an imported task's line points into another file — verify before marking
      if(secondary&&!(S.src.split("\n")[secondary-1]||"").includes("class "+st.task)) secondary=null;
    }
    else if(d.tasks[S.sel]) primary=d.tasks[S.sel].line;
  }
  if(!primary) return;
  const mark=(l,cls)=>{const el=panel.querySelector(`[data-l="${l}"]`);if(el)el.classList.add(cls);return el;};
  if(secondary) mark(secondary,"hl2");
  const el=mark(primary,"hl");
  if(el&&scroll) el.scrollIntoView({block:"center",behavior:"smooth"});
}

// ---------- layout ----------
function layout(){
  const P=S.data.pipeline;
  const pos={}, waves=P.waves;
  const hasInputs=S.data.edges.some(e=>e.src==="_inputs");
  const cols=Math.max(...waves.map(w=>w.length),1);
  const width=Math.max(cols*(NW+GX)+PAD*2, hasInputs?NW+PAD*2:0, 720);
  let y=PAD;
  if(hasInputs){pos._inputs={x:(width-NW)/2,y,w:NW,h:34,inputs:true}; y+=34+GY;}
  const bands=[];
  waves.forEach((wave,i)=>{
    const h=nodeH();
    bands.push({y:y-10,h:h+20,i});
    const total=wave.length*NW+(wave.length-1)*GX;
    let x=(width-total)/2;
    for(const v of wave){pos[v]={x,y,w:NW,h}; x+=NW+GX;}
    y+=h+GY;
  });
  return {pos,width,height:y+PAD,bands};
}
function nodeH(){return NH+(S.layers.tools?16:0);}

// ---------- canvas ----------
function renderCanvas(){
  const svg=$("canvas");
  if(!S.data||!S.data.pipeline){$("empty").style.display="block";svg.innerHTML="";return;}
  $("empty").style.display="none";
  const d=S.data, P=d.pipeline, {pos,width,height,bands}=layout();
  svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
  svg.setAttribute("width",width); svg.setAttribute("height",height);
  const marker=(id,color)=>`<marker id="${id}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="${color}"/></marker>`;
  let out=`<defs>${marker("arr","#3d4a68")}${marker("arrg","#e6b455")}${marker("arrv","#b08df0")}</defs>`;

  if(S.layers.waves) for(const b of bands)
    out+=`<rect class="wave-band" x="8" y="${b.y}" width="${width-16}" height="${b.h}" rx="8"/>
          <text class="wave-lbl" x="18" y="${b.y+16}">wave ${b.i+1}</text>`;

  // edges
  for(const e of d.edges){
    if(e.kind==="gate"&&!S.layers.gates) continue;
    const a=pos[e.src], b=pos[e.dst]; if(!a||!b) continue;
    const x1=a.x+a.w/2, y1=a.y+a.h, x2=b.x+b.w/2, y2=b.y;
    const mid=(y1+y2)/2;
    const path=`M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2-4}`;
    const dead=S.sim&&e.kind==="gate"&&S.gateVals[e.labels[0]]===false;
    out+=`<path class="edge ${e.kind}${dead?" dead":""}" d="${path}"/>`;
    out+=`<path class="edge-hit" d="${path}" data-edge="${esc(e.src)}|${esc(e.dst)}|${e.kind}"/>`;
    if(e.kind==="gate")
      out+=`<text class="edge-lbl" x="${(x1+3*x2)/4+8}" y="${(mid+y2)/2-4}">${esc(e.labels[0])}</text>`;
  }

  // nodes
  const issueByOwner={};
  for(const i of d.lint){if(i.owner)(issueByOwner[i.owner]??=[]).push(i);}
  for(const [v,p] of Object.entries(pos)){
    if(p.inputs){
      out+=`<g class="node inputs${S.sel==="_inputs"?" sel":""}" data-node="_inputs">
        <rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="9"/>
        <text class="task" x="${p.x+p.w/2}" y="${p.y+21}" text-anchor="middle">dispatch inputs: ${esc(P.inputs.join(", "))}</text></g>`;
      continue;
    }
    const st=P.steps.find(s=>s.var===v);
    const task=d.tasks[st.task]||{};
    const issues=issueByOwner[st.task]||[];
    const skipped=S.sim&&S.skipped.has(v);
    let cls="node"+(S.sel===v?" sel":"")+(skipped?" skipped":"");
    if(S.layers.trace&&S.trace){
      const rec=(S.trace.steps||[]).find(x=>x.var===v);
      if(rec) cls+=` t-${rec.status}`;
    }
    const defAttr=d.tasks[st.task]?` data-def="${esc(st.task)}"`:"";
    let g=`<g class="${cls}" data-node="${esc(v)}">
      <rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>
      <text class="var" x="${p.x+12}" y="${p.y+21}">${esc(v)}</text>
      <text class="task" x="${p.x+12}" y="${p.y+37}"${defAttr}>${esc(st.task)}${st.fanout_over?"  ×N":""}${st.serialized?" (serialized)":""}${defAttr?"<title>view the Task definition in source</title>":""}</text>`;
    // badges
    let bx=p.x+12, by=p.y+51;
    const badge=(txt,color)=>{const w=txt.length*5.6+10;
      const b=`<rect x="${bx}" y="${by-9}" width="${w}" height="12" rx="4" fill="${color}22" stroke="${color}55"/>
               <text class="badge" x="${bx+5}" y="${by}" fill="${color}">${esc(txt)}</text>`;bx+=w+5;return b;};
    if(S.layers.failure){
      if(task.on_failure) g+=badge(task.on_failure.split(",")[0], task.on_failure==="abort"?"#e5636c":"#8b96af");
      if(task.undo) g+=badge("undo","#b08df0");
      if(task.has_on_uncertain) g+=badge("uncertain?","#5cc492");
    }
    if(issues.length){
      const errs=issues.some(i=>i.severity==="error");
      g+=badge(`${issues.length} lint`, errs?"#e5636c":"#e0a34d");
    }
    if(v in S.pins) g+=badge("pinned","#e6b455");
    if(S.layers.tools&&task.tools&&task.tools.length){
      const names=task.tools.map(t=>t.name+(t.strict?"!":"")).join(" · ");
      g+=`<text class="chips" x="${p.x+12}" y="${p.y+NH+8}">${esc(names.length>34?names.slice(0,33)+"…":names)}</text>`;
    }
    out+=g+`</g>`;
  }
  svg.innerHTML=out;

  svg.querySelectorAll(".node").forEach(n=>n.addEventListener("click",()=>{S.sel=n.dataset.node;renderAll();syncSource();}));
  // the task label (or a double-click anywhere on the node) opens the Task
  // class definition; a plain click keeps meaning "the bind in the pipeline"
  svg.querySelectorAll("text.task[data-def]").forEach(t=>t.addEventListener("click",ev=>{
    ev.stopPropagation();
    S.sel=t.closest(".node").dataset.node;renderAll();
    jumpToDef(t.dataset.def);
  }));
  svg.querySelectorAll(".node").forEach(n=>n.addEventListener("dblclick",()=>{
    const st=P.steps.find(s=>s.var===n.dataset.node);
    if(st) jumpToDef(st.task);
  }));
  svg.querySelectorAll(".edge-hit").forEach(h=>{
    h.addEventListener("mousemove",ev=>showEdgeTip(ev,h.dataset.edge));
    h.addEventListener("mouseleave",hideTip);
  });
}

// ---------- tooltips ----------
function showEdgeTip(ev,key){
  const [src,dst,kind]=key.split("|");
  const e=S.data.edges.find(x=>x.src===src&&x.dst===dst&&x.kind===kind);
  if(!e) return;
  let html;
  if(kind==="gate"){
    const skips=(S.data.pipeline.gate_skips[dst]||[]);
    html=`<span class="h">gate</span>  ${esc(e.labels[0])}<br>` +
         `<span class="h">if false, also skips:</span> ${skips.length?esc(skips.join(", ")):"nothing else"}`;
  }else{
    html=`<span class="h">${kind==="fanout"?"fan-out":"data flow"}  ${esc(src)} → ${esc(dst)}</span><br>`+
         e.labels.map(l=>esc(l)).join("<br>");
  }
  const t=$("tip"); t.innerHTML=html; t.style.display="block";
  t.style.left=Math.min(ev.clientX+14,innerWidth-440)+"px";
  t.style.top=(ev.clientY+12)+"px";
}
function hideTip(){$("tip").style.display="none";}

// ---------- simulator ----------
function computeSkips(){
  S.skipped=new Set();
  if(!S.sim||!S.data||!S.data.pipeline) return;
  const P=S.data.pipeline, byVar={};
  for(const s of P.steps) byVar[s.var]=s;
  for(const wave of P.waves) for(const v of wave){
    const s=byVar[v]; let skip=false;
    for(const need of s.needs) if(S.skipped.has(need.root)&&!need.optional){skip=true;break;}
    if(!skip&&s.gate&&S.gateVals[s.gate]===false) skip=true;
    if(skip) S.skipped.add(v);
  }
}
function renderSimBar(){
  $("simbar").style.display=S.sim?"block":"none";
  $("simtgl").classList.toggle("on",S.sim);
  if(!S.sim||!S.data||!S.data.pipeline) return;
  const P=S.data.pipeline;
  const total=P.steps.length, skipped=S.skipped.size;
  $("simbanner").textContent=`${total-skipped} run · ${skipped} skipped`;
  const gates=[...new Set(P.steps.filter(s=>s.gate).map(s=>s.gate))];
  $("simgates").innerHTML=gates.map(g=>
    `<label class="${S.gateVals[g]?"":"off"}"><input type="checkbox" data-gate="${esc(g)}" ${S.gateVals[g]?"checked":""}> ${esc(g)}</label>`
  ).join("");
  $("simgates").querySelectorAll("input").forEach(cb=>cb.addEventListener("change",()=>{
    S.gateVals[cb.dataset.gate]=cb.checked; computeSkips(); renderAll();
  }));
}

// ---------- inspector ----------
function renderInspector(){
  const el=$("inspector");
  if(!S.data){el.innerHTML="";return;}
  const d=S.data;
  if(S.sel==="_inputs"){
    el.innerHTML=`<h2>dispatch inputs</h2><div class="kv">`+
      d.pipeline.inputs.map(n=>`<div><span class="k">${esc(n)}</span></div>`).join("")+`</div>`;
    return;
  }
  const st=d.pipeline?.steps.find(s=>s.var===S.sel);
  if(st&&st.task==="<derived>"){
    const red=d.pipeline.reduction;
    el.innerHTML=`<h2>${esc(st.var)} = <span class="task">derived</span></h2>`+
      `<div class="doc">A derivation bind (spec 2.2): evaluated mechanically, `+
      `first match wins top to bottom. Always yields a value — skips never `+
      `propagate through it.</div>`+
      (red&&red.name===st.var?reductionGrid(red):"");
    return;
  }
  const taskName=st?st.task:(d.tasks[S.sel]?S.sel:null);
  if(!taskName){el.innerHTML=`<div class="muted">Click a step on the canvas.</div>`;return;}
  const t=d.tasks[taskName];
  const linkable=taskDefLine(taskName)!=null;
  let h=`<h2>${st?esc(st.var)+" = ":""}<span class="task${linkable?" link":""}" id="defjump" `+
    `data-def="${esc(taskName)}"${linkable?' title="view the Task definition in source"':""}>${esc(taskName)}</span></h2>`;
  if(st&&!window.EMBEDDED_SPEC){
    const pinned=st.var in S.pins;
    h+=`<div style="margin:8px 0"><button class="pinbtn ${pinned?"on":""}" id="pinbtn">${pinned?"📌 pinned — click to unpin":"📌 pin for the agent"}</button></div>`;
    if(pinned) h+=`<textarea id="pinnote" placeholder="note for the agent (what should change here?)">${esc(S.pins[st.var])}</textarea>`;
  }
  if(st&&st.gate) h+=`<div class="decl"><span class="lbl">gate</span>runs only if <b>${esc(st.gate)}</b></div>`;
  if(st&&st.fanout_over) h+=`<div class="decl"><span class="lbl">fan-out</span>each of ${esc(st.fanout_over)}${st.filter?` where ${esc(st.filter)}`:""}</div>`;
  h+=`<div class="doc">${esc(t.docstring||"(no docstring)")}</div>`;

  if(t.inputs.length){
    h+=`<h3>inputs</h3><div class="kv">`+t.inputs.map(i=>
      `<div><span class="k">${esc(i.name)}</span>: <span class="t">${esc(i.type)}</span></div>`).join("")+`</div>`;
  }
  h+=`<h3>returns</h3><div class="kv"><span class="t">${esc(t.returns)}</span></div>`;
  if(t.returns_schema&&d.schemas[t.returns_schema]){
    h+=`<div class="field" style="margin-top:4px">`+d.schemas[t.returns_schema].fields.map(f=>
      `<div>&nbsp;&nbsp;${esc(f.name)}: <span class="t">${esc(f.type)}</span>${f.bounds?` <span class="b">[${esc(f.bounds)}]</span>`:""}</div>`).join("")+`</div>`;
  }
  if(t.tools.length){
    h+=`<h3>tools</h3>`+t.tools.map(x=>
      `<div class="tool"><b>${esc(x.name)}</b>${x.strict?'<span class="flag strict">strict</span>':""}${x.exclusive?'<span class="flag excl">exclusive</span>':""}<span class="surface">${esc(x.surface)}</span></div>`).join("");
  }
  if(t.rules.length){
    h+=`<h3>rules (${t.rules.length})</h3>`+t.rules.map(r=>
      `<div class="rule ${r.severity}"><span class="sev">${r.severity}</span><b>${esc(r.id)}</b>${r.since?`<span class="src">${esc(r.since)}</span>`:""}${r.source?`<span class="src">${esc(r.source)}</span>`:""}<br>${esc(r.text)}${r.why?`<span class="why">— ${esc(r.why)}</span>`:""}</div>`).join("");
  }
  const red=d.pipeline&&d.pipeline.reduction;
  if(red&&t.is_orchestrator) h+=reductionGrid(red);
  h+=`<h3>failure</h3>`;
  h+=`<div class="decl"><span class="lbl">on_failure</span>${esc(t.on_failure||"undeclared")}</div>`;
  if(t.on_item_failure) h+=`<div class="decl"><span class="lbl">on_item_failure</span>${esc(t.on_item_failure)}</div>`;
  h+=`<div class="decl"><span class="lbl">on_uncertain</span>${t.has_on_uncertain?"declared":"—"}</div>`;
  if(t.undo) h+=`<div class="decl"><span class="lbl">undo</span>${esc(t.undo)}</div>`;
  if(t.meta) h+=`<h3>meta</h3><div class="kv"><span class="t">${esc(JSON.stringify(t.meta))}</span></div>`;
  el.innerHTML=h;

  const defjump=$("defjump");
  if(defjump&&defjump.classList.contains("link"))
    defjump.addEventListener("click",()=>jumpToDef(defjump.dataset.def));
  const pinbtn=$("pinbtn");
  if(pinbtn&&st){
    pinbtn.addEventListener("click",async()=>{
      const pinned=st.var in S.pins;
      await fetch("/api/pin",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({var:st.var,pinned:!pinned})});
      if(pinned) delete S.pins[st.var]; else S.pins[st.var]="";
      renderAll();
    });
  }
  const pinnote=$("pinnote");
  if(pinnote&&st){
    pinnote.addEventListener("change",()=>{
      S.pins[st.var]=pinnote.value;
      fetch("/api/note",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({var:st.var,note:pinnote.value})});
    });
  }
}

function reductionGrid(red){
  const label=red.source==="derivation"?`derivation <b>${esc(red.name)}</b>`:`prose mapping (${esc(red.name)})`;
  return `<h3>routing — ${label}</h3><table class="redtable">`+
    `<tr><th>condition</th>${red.fields.map(f=>`<th>${esc(f)}</th>`).join("")}</tr>`+
    red.rows.map(r=>`<tr class="${r.condition==="otherwise"?"other":""}"><td>${esc(r.condition)}</td>${
      red.fields.map(f=>`<td>${esc(r.values[f]??"")}</td>`).join("")}</tr>`).join("")+`</table>`;
}

// ---------- issues ----------
function renderIssues(){
  const el=$("issues");
  if(!S.data){el.innerHTML="";return;}
  const lint=S.data.lint;
  $("issuecnt").textContent=lint.length;
  if(!lint.length){el.innerHTML=`<div class="muted" style="padding-top:10px">clean — no lint findings</div>`;return;}
  el.innerHTML=lint.map((i,n)=>
    `<div class="issue ${i.severity}" data-i="${n}"><span class="code">${esc(i.code)}</span>${esc(i.message)}<br><span class="loc">line ${i.line}${i.owner?` · ${esc(i.owner)}`:""}</span></div>`).join("");
  el.querySelectorAll(".issue").forEach(node=>node.addEventListener("click",()=>{
    const i=lint[+node.dataset.i];
    if(i.owner){
      const st=S.data.pipeline?.steps.find(s=>s.task===i.owner);
      S.sel=st?st.var:i.owner;
      document.querySelector('[data-tab="inspector"]').click();
      renderAll();
    }
    if(i.line) syncSource(i.line);  // the finding's own line beats the owner's
  }));
}

// ---------- wiring ----------
document.querySelectorAll(".tgl[data-layer]").forEach(t=>t.addEventListener("click",()=>{
  const l=t.dataset.layer; S.layers[l]=!S.layers[l]; t.classList.toggle("on",S.layers[l]); renderCanvas();
}));
$("simtgl").addEventListener("click",()=>{S.sim=!S.sim;computeSkips();renderAll();});
$("srctgl").addEventListener("click",()=>{
  const on=$("srcpanel").classList.toggle("on");
  $("srctgl").classList.toggle("on",on);
  if(on) syncSource();
});
$("simreset").addEventListener("click",()=>{for(const k in S.gateVals)S.gateVals[k]=true;computeSkips();renderAll();});
document.querySelectorAll("#tabs .tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.toggle("on",x===t));
  $("inspector").classList.toggle("on",t.dataset.tab==="inspector");
  $("issues").classList.toggle("on",t.dataset.tab==="issues");
}));
// shareable view state: #layers=tools,waves&sim=1&off=mark&sel=build
(function initFromHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("layers")) for(const l of h.get("layers").split(","))
    if(l in S.layers) S.layers[l]=true;
  document.querySelectorAll(".tgl[data-layer]").forEach(t=>
    t.classList.toggle("on",S.layers[t.dataset.layer]));
  if(h.get("sim")==="1") S.sim=true;
  if(h.get("off")) for(const v of h.get("off").split(",")) S.gateVals[v]=false;
  if(h.get("sel")) S.sel=h.get("sel");
})();
poll();
</script>
